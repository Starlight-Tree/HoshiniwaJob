# hoshiniwa-job のローカル開発用（Postgres 17 + FastAPI + Next.js）。
#   docker compose up -d --build    # 起動（マイグレーションもダミーデータも流さない）
#   初めての環境は、先に README の「初めて起動する」の手順（db → migrate → seed → seed-images）を実行する
#   http://localhost:3200            # 画面（求人検索）
#   http://localhost:8200/docs       # API の仕様（FastAPI の自動文書）
# 他のローカルのサービスと同時に動かせるよう、ポートは 3200 / 8200 にしてある。
name: hoshiniwa-job

services:
  # 求人のデータ。ホストにポートを公開せず、internal の backend-net（外へも出られない）にだけ置く。
  # 空のボリュームで初めて起動したときだけ、db/ の SQL（テーブルとマスタ）を流し込む。
  db:
    image: postgres:17
    container_name: hoshiniwa-job-db
    # 表示用ラベル
    labels:
      local.ui.group: "app-hoshiniwa-job"
    environment:
      POSTGRES_DB: hoshiniwa
      POSTGRES_USER: hoshiniwa
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:-hoshiniwa-local}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed_codes.sql:/docker-entrypoint-initdb.d/02-seed-codes.sql:ro
    networks:
      - backend-net
    healthcheck:
      # -h 127.0.0.1: 初回の初期化中の一時サーバー（ソケットだけ待ち受ける）を、起動済みと見なさないため
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hoshiniwa -d hoshiniwa"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- 次の 3 つは「道具」（profile: tools）。docker compose up では起動しない。必要なときに docker compose run --rm <名前> で 1 回だけ実行する ---
  # 通常の起動（up）はマイグレーションもダミーデータも流さない。本番では migrate だけを、デプロイの作業として明示的に実行する。

  # マイグレーション。既存の DB には、データを変えずに足りないものだけ足す。--status / --dry-run は README の「マイグレーション」
  migrate:
    build: ./backend
    container_name: hoshiniwa-job-migrate
    profiles: ["tools"]
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: &database_url "postgresql://hoshiniwa:${LOCAL_DB_PASSWORD:-hoshiniwa-local}@db:5432/hoshiniwa"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  # ダミーの求人・アカウントを入れる（開発・テスト専用。すでにデータがあれば何もせず、既存の求人に demo_key を結ぶだけ。入れ直すときは README の「データのリセット」）
  seed:
    build: ./backend
    container_name: hoshiniwa-job-seed
    # 表示用ラベル
    labels:
      local.ui.group: "app-hoshiniwa-job"
    profiles: ["tools"]
    command: ["python", "-m", "app.seed_demo"]
    environment:
      DEMO_DATA: allow   # この値が無いと、seed_demo は実行を拒否する（本番の DB に誤って入れないため）
      DATABASE_URL: *database_url
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  # ダミーの画像を登録・承認する（開発・テスト専用。何度実行しても増えない）。元ファイルが無い環境でも、api と画面は起動する
  seed-images:
    build: ./backend
    container_name: hoshiniwa-job-seed-images
    profiles: ["tools"]
    command: ["python", "-m", "app.seed_images", "--source-dir", "/demo-images"]
    environment:
      DEMO_DATA: allow
      # 画像の保存。ここは開発用のフォルダー（名前付きボリューム dev-media。消してよい）。本番は s3（Cloudflare R2）にする。README の「画像」
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/media
      IMAGE_PUBLIC_BASE_URL: /media
      DATABASE_URL: *database_url
    volumes:
      - dev-media:/data/media
      # ダミーの画像の元ファイル（読み取り専用）。画像の置き場を移したら、--source-url（README）に切り替える
      - ./frontend/public/images/generated/recruits:/demo-images:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  api:
    build: ./backend
    container_name: hoshiniwa-job-api
    # 表示用ラベル
    labels:
      local.ui.group: "app-hoshiniwa-job"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/code/app"]
    environment:
      # 画像の保存。既定は開発用のフォルダー（名前付きボリューム dev-media。消してよい）。R2（s3）へ切り替えるときだけ、.env（Git 管理外）に値を書く。README の「画像」
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      STORAGE_LOCAL_DIR: /data/media
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-/media}"
      STORAGE_S3_ENDPOINT_URL: "${STORAGE_S3_ENDPOINT_URL:-}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
      STORAGE_S3_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY_ID:-}"
      STORAGE_S3_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_ACCESS_KEY:-}"
      DATABASE_URL: *database_url
      CORS_ORIGINS: "http://localhost:3200"
      # ホスト↔コンテナ間のボリュームでファイル変更通知が届かない環境（Docker Desktop 等）向け
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/code/app
      - dev-media:/data/media
    ports:
      - "127.0.0.1:8200:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 画面の開発サーバー（frontend/ の next dev）。API はサーバー側（Next.js）から呼ぶので、ブラウザーは API を直接呼ばない。
  frontend:
    image: node:24-slim
    container_name: hoshiniwa-job-frontend
    # 表示用ラベル
    labels:
      local.ui.group: "app-hoshiniwa-job"
    working_dir: /app
    environment:
      API_BASE_URL: "http://api:8000"
      # 公開画像の URL の頭。既定は /media（API が配る）。R2 に切り替えるときは .env で api と同じ値にする（next.config.ts が読む）
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-/media}"
    volumes:
      - ./frontend:/app
      # node_modules と .next は、ホストのものと分ける（ネイティブの依存が OS ごとに違うため）
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

# frontend-net: frontend と api（frontend は npm install で外へ出る）。
# backend-net: api・db と、道具（migrate・seed・seed-images）だけ。internal なので、db は外へ出られず、ホストからも届かない。
networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  pg-data:
  dev-media:   # 開発用の画像の保存先（API と seed-images が共有）。docker compose down -v で消える
  frontend_node_modules:
  frontend_next_cache:
