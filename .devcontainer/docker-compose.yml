# 開発コンテナ（dev）の定義。devcontainer.json の dockerComposeFile が、../docker-compose.yml（db・api・frontend）に重ねて読む。
# ホストの `docker compose up`（ルートの docker-compose.yml だけ）には dev は含まれない。
# 相対パスは、最初のファイル（../docker-compose.yml）のあるリポジトリ直下が基準（このファイルの場所ではない）。
services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: hoshiniwa-job-devcontainer
    # 表示用ラベル
    labels:
      local.ui.group: "Devcontainers"
    init: true
    command: sleep infinity
    volumes:
      - .:/workspaces/hoshiniwa-job:cached
      - claude-config:/home/vscode/.claude
      # Project Manager の projects.json（docunavi と hoshiniwa-job で共有。資格情報は入れない）。
      - shared-project-manager:/home/vscode/.project-manager
    environment:
      TZ: Asia/Tokyo
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # 読み取り専用に近いプロキシ（.devcontainer/docker-proxy/compose.yml）。hoshiniwa-dev の中でだけ引ける名前。
      # ホストのソケットは、この dev にはマウントしない。
      DOCKER_HOST: tcp://hoshiniwa-docker-proxy:2375
    # hoshiniwa-dev だけに繋ぐ（プロキシとの通信用。外へも出られる）。frontend-net・backend-net には繋がない
    # （api と db に、開発コンテナから直接届かないようにするため）。
    networks:
      - dev-net

networks:
  # .devcontainer/docker-proxy/compose.yml が作る（devcontainer.json の initializeCommand が先に起動する）。
  dev-net:
    name: hoshiniwa-dev
    external: true

volumes:
  # Claude Code の設定・認証・履歴。docunavi の claude-config と同じ外部ボリュームを、名前で共有する（ホストにあらかじめ作ってある）。
  # 履歴はパスごとのフォルダーに分かれるが、認証情報と .claude.json は共有される。
  claude-config:
    name: claude-code-config-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
    external: true
  # docunavi と hoshiniwa-job の両方が、同じ名前で参照する（Project Manager の projects.json だけ）。
  # external: ホストで 1 回 `docker volume create devcontainer-shared-project-manager` を実行してから起動する（無いと起動に失敗する）。
  shared-project-manager:
    name: devcontainer-shared-project-manager
    external: true
