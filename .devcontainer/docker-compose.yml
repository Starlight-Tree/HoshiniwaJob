# 開発コンテナ（dev）の定義。devcontainer.json の dockerComposeFile が、../docker-compose.yml（db・seed・api・frontend）に重ねて読む。
# ホストの `docker compose up`（ルートの docker-compose.yml だけ）には dev は含まれない。
# 相対パスは、最初のファイル（../docker-compose.yml）のあるリポジトリ直下が基準（このファイルの場所ではない）。
services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: hoshiniwa-job-devcontainer
    # 表示用ラベル
    labels:
      local.ui.group: "devcontainers"
    init: true
    command: sleep infinity
    volumes:
      - .:/workspaces/hoshiniwa-job:cached
      - claude-config:/home/vscode/.claude
    environment:
      TZ: Asia/Tokyo
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # 読み取り専用に近いプロキシ（.devcontainer/docker-proxy/compose.yml）。hoshiniwa-dev の中でだけ引ける名前。
      # ホストのソケットは、この dev にはマウントしない。
      DOCKER_HOST: tcp://hoshiniwa-docker-proxy:2375
    # hoshiniwa-dev だけに繋ぐ（プロキシとの通信用。外へも出られる）。frontend-net・backend-net には繋がない
    # （api と db に、開発コンテナから直接届かないようにするため）。
    networks:
      - dev-net

networks:
  # .devcontainer/docker-proxy/compose.yml が作る（devcontainer.json の initializeCommand が先に起動する）。
  dev-net:
    name: hoshiniwa-dev
    external: true

volumes:
  # Claude Code の設定・認証・履歴。docunavi の claude-config と同じ外部ボリュームを、名前で共有する（2026-11-10 に変更。以前は P2 で「共有しない」と決定）。
  # docunavi 側での実測（2026-11-10、docunavi のコンテナ内）: ~/.claude は claude-code-config-166oi…。hoshiniwa-job 自身のコンテナでは未実測。
  # 履歴はパスごとのフォルダー（projects/-workspaces-hoshiniwa-job/ など）に分かれるが、認証情報と .claude.json は共有される。
  claude-config:
    name: claude-code-config-166oi5198v23umj7mu1l48p8d00au5920c8hog97rp6gbuvfuoe4
    external: true
